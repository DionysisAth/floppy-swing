name: floppy_swing
description: "Floppy Swing - a one-thumb ragdoll grappling-rope physics game for iOS and Android."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  # Pure-Dart Box2D port, vendored with a revolute-joint fix. See
  # third_party/forge2d/PATCHES.md.
  forge2d:
    path: third_party/forge2d
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  google_mobile_ads: ^9.1.0
  path_provider: ^2.1.6
  http: ^1.2.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The game server, so client tests can run against the real API in-process.
  floppy_server:
    path: server
  shelf: ^1.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/levels/
    - assets/daily/
    - assets/audio/
  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
