# Publishes to Google Play. Run it by hand: Actions > Publish to Google Play >
# Run workflow. Needs these repository secrets (docs/RELEASING.md):
#   PLAY_SERVICE_ACCOUNT_JSON  - the service account key (JSON) with access
#                                to the app in Play Console
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD       - the upload key
name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Track (internal, alpha, beta or production)
        default: production
        required: true
      status:
        description: Release status (draft until the app has been reviewed once; then completed)
        default: draft
        required: true
      listing:
        description: Also upload the store listing text and graphics
        type: boolean
        default: true
      notes:
        description: Release notes (what's new)
        default: ''

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the upload key secrets first (docs/RELEASING.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload.jks
          cat > android/key.properties <<PROPS
          storeFile=../upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - name: Build the store bundle (real ads)
        run: flutter build appbundle --release --dart-define=REAL_ADS=true --build-number=$((GITHUB_RUN_NUMBER + 1000))
      - name: Service account
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::Add the PLAY_SERVICE_ACCOUNT_JSON secret first"
            exit 1
          fi
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
          pip install --quiet requests
      - name: Store listing
        if: inputs.listing
        env:
          PLAY_SERVICE_ACCOUNT: ${{ runner.temp }}/play.json
        run: python3 tool/store/play_publish.py listing
      - name: Upload the bundle
        env:
          PLAY_SERVICE_ACCOUNT: ${{ runner.temp }}/play.json
          TRACK: ${{ inputs.track }}
          STATUS: ${{ inputs.status }}
          NOTES: ${{ inputs.notes }}
        run: >
          python3 tool/store/play_publish.py bundle build/app/outputs/bundle/release/app-release.aab
          --track "$TRACK" --status "$STATUS" --notes "$NOTES"
      - uses: actions/upload-artifact@v4
        with:
          name: FloppySwing-play-bundle
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/play.json" android/upload.jks android/key.properties
