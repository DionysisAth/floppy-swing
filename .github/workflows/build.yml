# Builds installable test builds and publishes them as a GitHub pre-release.
#
#   Android: FloppySwing.apk (release build, signed with the debug key - fine
#            for testing, not for the Play Store).
#   iOS:     FloppySwing-unsigned.ipa (no code signing). Install it on your own
#            iPhone with a re-signing tool such as Sideloadly or AltStore, or
#            use it to check the iOS build compiles.
name: Build test apps

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk FloppySwing.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FloppySwing-android
          path: FloppySwing.apk

  android-smoke-test:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FloppySwing-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tool/ci_smoke_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-test
          path: |
            logcat.txt
            smoke_*.png

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry FloppySwing-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FloppySwing-ios-unsigned
          path: FloppySwing-unsigned.ipa

  release:
    needs: [android, android-smoke-test, ios]
    # Only publish builds that launched on the emulator without crashing.
    if: always() && needs.android-smoke-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Floppy Swing test build ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            FloppySwing.apk
            FloppySwing-unsigned.ipa
          body: |
            Test build from `${{ github.ref_name }}` @ ${{ github.sha }}.

            **Android:** download `FloppySwing.apk` on your phone, open it and allow
            "install unknown apps" when asked.

            **iPhone:** iOS can't install an APK, and unsigned apps can't be installed
            directly. Use `FloppySwing-unsigned.ipa` with Sideloadly or AltStore (they sign
            it with your Apple ID), or publish through TestFlight with an Apple Developer
            account. The IPA is missing if the iOS build failed.
